<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classic Lemon Drizzle Cake</title>
  <meta property="og:image" content="https://example.com/images/lemon-cake-og.jpg">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Classic Lemon Drizzle Cake",
    "description": "A delicious, tangy British teatime classic loaf cake.",
    "prepTime": "PT15M",
    "cookTime": "PT45M",
    "totalTime": "PT1H",
    "recipeYield": "8 servings",
    "image": [
      "https://example.com/images/lemon-cake-1.jpg",
      "https://example.com/images/lemon-cake-2.png"
    ],
    "recipeIngredient": [
      "225g unsalted butter, softened",
      "225g caster sugar",
      "4 large eggs",
      "225g self-raising flour",
      "zest of 2 lemons"
    ],
    "recipeInstructions": [
      {
        "@type": "HowToStep",
        "text": "Heat the oven to 180C/160C Fan/Gas 4 and line a loaf tin."
      },
      {
        "@type": "HowToStep",
        "text": "Beat butter and sugar together until pale and creamy, then add eggs one by one."
      },
      {
        "@type": "HowToStep",
        "text": "Fold in the flour and lemon zest, then spoon into the tin and bake for 45 mins."
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Classic Lemon Drizzle Cake</h1>
</body>
</html>
